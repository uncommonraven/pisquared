name: ci

# Manual only. The Go implementation is being deprecated, so this never runs on
# push or pull request; it can be started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Run all three platforms even if one fails, so a single run shows the
      # status of every platform rather than stopping at the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Clone the repository at the commit being checked.
      - uses: actions/checkout@v5

      # Install the Go version named in go.mod, so every platform builds with
      # the same version this repository declares.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Compile every package and write the ./pisquared executable. CGO is off
      # because the released binary is static; building with cgo on would let
      # something pass here that fails for someone running the static binary.
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      # Report suspicious constructs that compile but are probably wrong.
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      # Run every test in the module. Exit status is non-zero if any test fails,
      # which fails the job and, through it, the matrix entry for this platform.
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

  # The catalogue is committed data, and the mapping it holds cannot be derived
  # from upstream: DietPi publishes a directory listing of filenames and nothing
  # saying which device each one boots. The one failure that can be caught is
  # upstream renaming or removing an image, which would otherwise reach an
  # operator as a 404 partway through a 200 MiB download. So every committed
  # address is requested here, and the build fails naming the entry and the
  # address if one does not resolve.
  #
  # This is one platform on purpose. The check asks a remote server whether it
  # serves a file; running it three times over the same four addresses triples
  # the requests without covering anything a second run could, and would turn
  # one upstream slowdown into three red builds.
  catalogue-addresses:
    name: catalogue addresses resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Behind the `online` tag because it reaches the publisher's servers. A
      # developer's `go test ./...` must not fail because dietpi.com is slow;
      # this job is where that belongs.
      - name: Every committed image address resolves
        run: go test -tags=online -run TestEveryCommittedAddressResolves -v ./internal/catalogue/
        env:
          CGO_ENABLED: "0"